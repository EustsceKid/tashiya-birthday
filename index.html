<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 21st Birthday, Tashiya! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ============ HEADER & TITLE ============ */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(106, 168, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6ba8f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            animation: slideDown 1s ease-out;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: #a8dadc;
            animation: fadeIn 1.5s ease-out;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ============ CONFETTI ANIMATION ============ */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        /* ============ LETTER SECTION ============ */
        .letter-section {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px 20px;
            background: rgba(48, 43, 99, 0.5);
            border-radius: 20px;
            border: 2px solid rgba(255, 107, 107, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            animation: slideUp 1s ease-out 0.3s both;
        }

        .letter-section h2 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 30px;
            color: #ffd93d;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .letter-content {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.8;
            color: #d0d0d0;
            font-style: italic;
            min-height: 200px;
            padding: 20px;
            border-left: 4px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
            border-radius: 10px;
        }

        .letter-content::before {
            content: '"';
            font-size: 3rem;
            color: #ff6b6b;
            opacity: 0.3;
            position: absolute;
            margin-left: -30px;
            margin-top: -10px;
        }

        .cursor {
            display: inline;
            width: 2px;
            height: 1.2em;
            background-color: #ff6b6b;
            animation: blink 0.7s infinite;
            margin-left: 3px;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        /* ============ GALLERY SECTION ============ */
        .gallery-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 40px 20px;
            animation: slideUp 1s ease-out 0.6s both;
        }

        .gallery-section h2 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 50px;
            color: #ffd93d;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 0 10px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            aspect-ratio: 1;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: linear-gradient(135deg, #302b63, #24243e);
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(255, 107, 107, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 107, 107, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 107, 107, 0.3);
            flex-direction: column;
            gap: 10px;
        }

        .gallery-placeholder p {
            font-size: 1rem;
            color: rgba(255, 107, 107, 0.2);
        }

        /* ============ UPLOAD SECTION ============ */
        .upload-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px 20px;
            background: rgba(255, 107, 107, 0.1);
            border: 2px dashed rgba(255, 107, 107, 0.5);
            border-radius: 15px;
            text-align: center;
        }

        .upload-section h3 {
            color: #ffd93d;
            margin-bottom: 20px;
        }

        .upload-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .upload-button:active {
            transform: translateY(0);
        }

        /* ============ FOOTER ============ */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 0.9rem;
            margin-top: 60px;
        }

        .footer p {
            margin-bottom: 10px;
        }

        .heart {
            display: inline-block;
            color: #ff6b6b;
            animation: heartBeat 1.2s infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* ============ ANIMATIONS ============ */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .header {
                padding: 40px 15px 30px;
            }

            .letter-section {
                margin: 40px 15px;
                padding: 25px 15px;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }

            .upload-section {
                margin: 30px 15px;
                padding: 20px 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                margin-bottom: 10px;
            }

            .letter-section {
                border-radius: 15px;
                padding: 20px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .upload-button {
                width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🎉 HAPPY 21ST BIRTHDAY 🎉</h1>
        <p class="subtitle">Welcome to your special day, Tashiya!</p>
    </div>

    <!-- LETTER SECTION -->
    <div class="letter-section">
        <h2>A Letter From Me To You</h2>
        <div class="letter-content">
            <span id="typewriter"></span><span class="cursor"></span>
        </div>
    </div>

    <!-- GALLERY SECTION -->
    <div class="gallery-section">
        <h2>Our Memories Together</h2>
        
        <div class="upload-section">
            <h3>📸 Add Your Special Photos</h3>
            <input 
                type="file" 
                id="photoUpload" 
                class="upload-input" 
                accept="image/*" 
                multiple
            >
            <button class="upload-button" onclick="document.getElementById('photoUpload').click()">
                Choose Photos
            </button>
            <p style="color: #999; font-size: 0.9rem; margin-top: 10px;">
                Click to upload JPG, PNG, or GIF files
            </p>
        </div>

        <div class="gallery-grid" id="gallery">
            <!-- Photos will be added here -->
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>Made with <span class="heart">❤️</span> for someone special</p>
        <p>© 2024 - Happy Birthday!</p>
    </div>

    <script>
        // ============ TYPEWRITER EFFECT ============
        const letter = `Dear Tashiya,

Today marks a special milestone in your life—you're turning 21! As I think about all the moments we've shared, I'm reminded of how incredible you are. Your smile lights up every room, your laugh is contagious, and your heart is pure gold.

I love you more than words could ever express. I love the way you make me laugh, the way your eyes sparkle when you're happy, and the way you make every moment feel special. You're not just my girlfriend; you're my best friend, my inspiration, and my greatest blessing.

Here's to 21 years of you being amazing, and to many more years of us creating beautiful memories together. You deserve all the happiness in the world, and I promise to do everything I can to make sure you have it.

Thank you for being you. Happy 21st Birthday, my love.

Forever yours,
Your favorite person 💕`;

        const typewriterElement = document.getElementById('typewriter');
        let index = 0;

        function typeWriter() {
            if (index < letter.length) {
                typewriterElement.textContent += letter.charAt(index);
                index++;
                setTimeout(typeWriter, 30);
            }
        }

        // Start typewriter effect when page loads
        window.addEventListener('load', typeWriter);

        // ============ CONFETTI ============
        function createConfetti() {
            const colors = ['#ff6b6b', '#ffd93d', '#6ba8f1', '#a8dadc'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `fall ${2 + Math.random() * 1}s ease-in forwards`;
                confetti.style.delay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }
        }

        // Trigger confetti on page load
        window.addEventListener('load', () => {
            createConfetti();
            // Repeat every 5 seconds
            setInterval(createConfetti, 5000);
        });

        // ============ PHOTO UPLOAD ============
        const photoUpload = document.getElementById('photoUpload');
        const gallery = document.getElementById('gallery');

        photoUpload.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);

            files.forEach(file => {
                const reader = new FileReader();

                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;

                    const item = document.createElement('div');
                    item.classList.add('gallery-item');
                    item.appendChild(img);
                    
                    const overlay = document.createElement('div');
                    overlay.classList.add('gallery-item-overlay');
                    overlay.textContent = '✨ Beautiful Memory ✨';
                    item.appendChild(overlay);

                    gallery.appendChild(item);
                };

                reader.readAsDataURL(file);
            });

            // Clear the input so the same file can be uploaded again
            photoUpload.value = '';
        });
